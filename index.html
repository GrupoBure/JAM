<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAM - Jabón Artesanal Mexicano</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b0b0b;
  font-family:Arial, Helvetica, sans-serif;
}
.stage{
  position:fixed;
  inset:0;
  background:#0b0b0b;
}
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#0b0b0b;
}
.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.28);
  pointer-events:none;
}
.logo-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  z-index:3;
}
.logo-wrap img{
  width:min(760px, 82vw);
  max-width:100%;
  height:auto;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,.30));
}
.fallback{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
  padding:24px;
  background:radial-gradient(circle at center, #1b1b1b 0%, #0b0b0b 70%);
  z-index:2;
  text-align:center;
}
.fallback.show{
  display:flex;
}
.fallback img{
  width:min(760px, 82vw);
  max-width:100%;
  height:auto;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,.30));
}
.fallback p{
  margin:0;
  color:#d8d8d8;
  font-size:14px;
  letter-spacing:.3px;
}
.debug{
  position:fixed;
  left:12px;
  bottom:12px;
  z-index:5;
  padding:8px 10px;
  border-radius:10px;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:12px;
  line-height:1.3;
  max-width:min(92vw, 560px);
  display:none;
}
.debug.show{
  display:block;
}
</style>
</head>
<body>
<div class="stage">
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="assets/JAM.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="logo-wrap" id="logoWrap">
    <img src="assets/logo.png" alt="JAM - Jabón Artesanal Mexicano">
  </div>

  <div class="fallback" id="fallback">
    <img src="assets/logo.png" alt="JAM - Jabón Artesanal Mexicano">
    <p>El video no pudo reproducirse en este navegador o con ese códec.</p>
  </div>
</div>

<div id="debug" class="debug"></div>

<script>
(function(){
  const video = document.getElementById('bgVideo');
  const fallback = document.getElementById('fallback');
  const debug = document.getElementById('debug');

  function showDebug(msg){
    debug.textContent = msg;
    debug.classList.add('show');
  }

  function useFallback(reason){
    fallback.classList.add('show');
    video.style.display = 'none';
    showDebug(reason);
  }

  // Intento explícito de reproducción
  video.muted = true;
  video.defaultMuted = true;
  video.setAttribute('muted', '');
  video.setAttribute('autoplay', '');
  video.setAttribute('playsinline', '');

  const playPromise = video.play();
  if (playPromise && typeof playPromise.catch === 'function') {
    playPromise.catch(err => {
      useFallback('No se pudo reproducir el video automáticamente: ' + (err && err.message ? err.message : err));
    });
  }

  video.addEventListener('error', function(){
    const mediaError = video.error;
    let detail = 'Error al cargar o reproducir el video.';
    if (mediaError) {
      if (mediaError.code === 1) detail = 'Carga del video abortada.';
      if (mediaError.code === 2) detail = 'Error de red al cargar el video.';
      if (mediaError.code === 3) detail = 'Error al decodificar el video. Suele ser códec incompatible.';
      if (mediaError.code === 4) detail = 'Formato de video no compatible o archivo no encontrado.';
    }
    useFallback(detail);
  });

  video.addEventListener('stalled', function(){
    showDebug('El video se detuvo mientras cargaba.');
  });

  video.addEventListener('loadeddata', function(){
    debug.classList.remove('show');
  });

  // Si en unos segundos sigue sin data visible, avisamos
  setTimeout(function(){
    if (video.readyState < 2) {
      showDebug('El video no terminó de cargar. Si la ruta está bien, el problema suele ser el códec del MP4.');
    }
  }, 4000);
})();
</script>
</body>
</html>
