<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jabón Artesanal Mexicano - JAM</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f0e6 url('./content/fondooscuro.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      color: #333;
      min-height: 100vh;
      position: relative;
    }

    /* ===== LOGO ===== */
    .logo {
      position: absolute;
      top: -65px;
      right: 100px;
      z-index: 50;
      max-width: 250px;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.55));
    }

    /* ===== BOTÓN CATÁLOGO ===== */
    .btn-catalogo {
      position: absolute;
      top: 35px;
      left: 40px;
      z-index: 50;
      background: #47ac72;
      color: white;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-catalogo:hover {
      background: #080808;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    /* ===== CARRUSEL DE VIDEOS ===== */
    .carousel {
      position: relative;
      max-width: 880px;
      margin: 120px auto 40px;
      padding: 15px;
      background: transparent;
    }

    .video-container {
      position: relative;
      text-align: center;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: rgba(0, 0, 0, 1);
      padding: 10px;
    }

    .video-container video {
      width: 100%;
      max-width: 820px;
      max-height: 520px;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
    }

    /* Ocultar controles del video */
    .video-container video::-webkit-media-controls {
      display: none !important;
    }
    .video-container video::-webkit-media-controls-panel,
    .video-container video::-webkit-media-controls-play-button,
    .video-container video::-webkit-media-controls-volume-slider,
    .video-container video::-webkit-media-controls-mute-button,
    .video-container video::-webkit-media-controls-timeline,
    .video-container video::-webkit-media-controls-current-time-display,
    .video-container video::-webkit-media-controls-time-remaining-display {
      display: none !important;
    }

    /* Flechas del carrusel */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      cursor: pointer;
      z-index: 20;
      transition: all 0.3s;
    }
    .arrow:hover {
      background: rgba(0,0,0,0.8);
      transform: translateY(-50%) scale(1.12);
    }
    .left  { left: 25px; }
    .right { right: 25px; }

    /* ===== GALERÍA ===== */
    .gallery {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .gallery h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.4rem;
      color: #444;
    }

    /* Filtros por categoría */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 35px 0 40px;
    }

    .filter-btn {
      background: #47ac72;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .filter-btn:hover {
      background: #3a8f5e;
      transform: translateY(-3px);
    }

    .filter-btn.active {
      background: #080808;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 18px rgba(0,0,0,0.4);
    }
    .grid img:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }

    /* ===== MODAL ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.70);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      max-width: 92%;
      max-height: 92vh;
    }
    .modal-content img {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 12px;
    }
    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 45px;
      color: #fff;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .carousel { 
        margin: 100px auto 30px; 
        padding: 10px; 
      }
      .arrow { 
        width: 46px; 
        height: 46px; 
        font-size: 30px; 
      }
      .left { left: 15px; }
      .right { right: 15px; }
      
      .logo {
        max-width: 180px;
        top: -40px;
        right: 30px;
      }
      
      .btn-catalogo {
        top: 25px;
        left: 20px;
        padding: 10px 22px;
        font-size: 1rem;
      }

      .filters {
        gap: 8px;
      }
      .filter-btn {
        padding: 10px 18px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- LOGO -->
  <img src="./content/logo.png" alt="Logo JAM" class="logo">

  <!-- BOTÓN CATÁLOGO -->
  <a href="catalogoTest.html" class="btn-catalogo">

    <div class="arrow right" id="next">›</div>
  </div>

      <button class="filter-btn" data-filter="varios">Productos Varios</button>
    </div>

    <div class="grid" id="photoGrid"></div>
  </div>

    function loadVideo(index) {
      currentVideoIndex = index;
      videoElement.src = `./content/${videos[index]}`;
      videoElement.play().catch(() => {});
    }

    videoElement.addEventListener('ended', () => {
      let nextIndex = currentVideoIndex + 1;
      if (nextIndex >= videos.length) nextIndex = 0;
      loadVideo(nextIndex);
    });

    document.getElementById('prev').addEventListener('click', () => {
      let newIndex = currentVideoIndex - 1;
      if (newIndex < 0) newIndex = videos.length - 1;
      loadVideo(newIndex);
    });

      let newIndex = currentVideoIndex + 1;

    const grid = document.getElementById('photoGrid');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const closeModal = document.getElementById('closeModal');

    // Función para renderizar fotos según filtro
    function renderPhotos(filter = 'all') {
      grid.innerHTML = '';

      const filteredPhotos = filter === 'all' 
        ? photos 
        : photos.filter(photo => photo.category === filter);

      filteredPhotos.forEach(photo => {
        const img = document.createElement('img');
        img.src = `./content/${photo.src}`;
        img.alt = photo.alt;
        img.addEventListener('click', () => {
          modalImage.src = `./content/${photo.src}`;
          modal.style.display = 'flex';
        });
        grid.appendChild(img);
      });
    }

    // Manejar filtros
    document.querySelectorAll('.filter-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        const filterValue = button.getAttribute('data-filter');
        renderPhotos(filterValue);
      });
    });

    // Cargar todas las fotos al inicio
    renderPhotos('all');

    // Modal
    closeModal.addEventListener('click', () => modal.style.display = 'none');
