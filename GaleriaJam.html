<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jabón Artesanal Mexicano - JAM</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f0e6 url('./content/fondooscuro.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      color: #333;
      min-height: 100vh;
      position: relative;
    }

    /* ===== LOGO ===== */
    .logo {
      position: absolute;
      top: -65px;
      right: 100px;
      z-index: 50;
      max-width: 250px;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.55));
    }

    /* ===== BOTÓN CATÁLOGO ===== */
    .btn-catalogo {
      position: absolute;
      top: 35px;
      left: 40px;
      z-index: 50;
      background: #d32f2f;           /* Rojo mexicano vibrante */
      color: white;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 15px rgba(211, 47, 47, 0.4);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-catalogo:hover {
      background: #b71c1c;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(211, 47, 47, 0.5);
    }

    .btn-catalogo::before {
      content: "🛒";
      font-size: 1.3rem;
    }

    /* ===== CARRUSEL DE VIDEOS ===== */
    .carousel {
      position: relative;
      max-width: 880px;
      margin: 120px auto 40px;
      padding: 15px;
      background: transparent;
    }

    .video-container {
      position: relative;
      text-align: center;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: rgba(0, 0, 0, 1);
      padding: 10px;
    }

    .video-container video {
      width: 100%;
      max-width: 820px;
      max-height: 520px;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
    }

    /* Ocultar controles del video */
    .video-container video::-webkit-media-controls {
      display: none !important;
    }
    .video-container video::-webkit-media-controls-panel,
    .video-container video::-webkit-media-controls-play-button,
    .video-container video::-webkit-media-controls-volume-slider,
    .video-container video::-webkit-media-controls-mute-button,
    .video-container video::-webkit-media-controls-timeline,
    .video-container video::-webkit-media-controls-current-time-display,
    .video-container video::-webkit-media-controls-time-remaining-display {
      display: none !important;
    }

    /* Flechas */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      cursor: pointer;
      z-index: 20;
      transition: all 0.3s;
    }
    .arrow:hover {
      background: rgba(0,0,0,0.8);
      transform: translateY(-50%) scale(1.12);
    }
    .left  { left: 25px; }
    .right { right: 25px; }

    /* ===== GALERÍA DE FOTOS ===== */
    .gallery {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .gallery h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.4rem;
      color: #444;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 18px rgba(0,0,0,0.4);
    }
    .grid img:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }

    /* ===== MODAL ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.70);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      max-width: 92%;
      max-height: 92vh;
    }
    .modal-content img {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 12px;
    }
    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 45px;
      color: #fff;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .carousel { 
        margin: 100px auto 30px; 
        padding: 10px; 
      }
      .arrow { 
        width: 46px; 
        height: 46px; 
        font-size: 30px; 
      }
      .left { left: 15px; }
      .right { right: 15px; }
      
      .logo {
        max-width: 180px;
        top: -40px;
        right: 30px;
      }
      
      .btn-catalogo {
        top: 25px;
        left: 20px;
        padding: 10px 22px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- LOGO -->
  <img src="./content/logo.png" alt="Logo JAM" class="logo">

  <!-- BOTÓN CATÁLOGO -->
  <a href="catalogoTest.html" class="btn-catalogo">
    Catálogo
  </a>

  <!-- CARRUSEL DE VIDEOS -->
  <div class="carousel">
    <div class="video-container">
      <video id="mainVideo" autoplay loop muted playsinline></video>
    </div>
    <div class="arrow left" id="prev">‹</div>
    <div class="arrow right" id="next">›</div>
  </div>

  <!-- GALERÍA DE FOTOS -->
  <div class="gallery">
    <h2>Galería de Productos</h2>
    <div class="grid" id="photoGrid"></div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <span class="close" id="closeModal">×</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="">
    </div>
  </div>

  <script>
    // ================== VIDEOS ==================
    const videos = [
      "video1.mp4", "video2.mp4", "video3.mp4", "video4.mp4",
      "video5.mp4", "video6.mp4", "video7.mp4"
    ];

    const videoElement = document.getElementById('mainVideo');
    let currentVideoIndex = 0;

    function loadVideo(index) {
      currentVideoIndex = index;
      videoElement.src = `./content/${videos[index]}`;
      videoElement.play().catch(() => {});
    }

    videoElement.addEventListener('ended', () => {
      let nextIndex = currentVideoIndex + 1;
      if (nextIndex >= videos.length) nextIndex = 0;
      loadVideo(nextIndex);
    });

    document.getElementById('prev').addEventListener('click', () => {
      let newIndex = currentVideoIndex - 1;
      if (newIndex < 0) newIndex = videos.length - 1;
      loadVideo(newIndex);
    });

    document.getElementById('next').addEventListener('click', () => {
      let newIndex = currentVideoIndex + 1;
      if (newIndex >= videos.length) newIndex = 0;
      loadVideo(newIndex);
    });

    loadVideo(0);

    // ================== GALERÍA DE FOTOS ==================
    const photos = [
      "Fot1 (1).webp", "Fot1 (2).webp", "Fot1 (3).webp", "Fot1 (4).webp",
      "Fot1 (5).webp", "Fot1 (6).webp", "Fot1 (7).webp", "Fot1 (8).webp",
      "Fot1 (9).webp","Fot1 (10).webp","Fot1 (11).webp","Fot1 (12).webp","Fot1 (13).webp","Fot1 (14).webp","Fot1 (15).webp",
      "Fot1 (16).webp","Fot1 (17).webp","Fot1 (18).webp","Fot1 (19).webp","Fot1 (20).webp","Fot1 (21).webp","Fot1 (22).webp",
      "Fot1 (23).webp","Fot1 (24).webp","Fot1 (25).webp","Fot1 (26).webp","Fot1 (27).webp","Fot1 (28).webp","Fot1 (29).webp",
      "Fot1 (30).webp","Fot1 (31).webp","Fot1 (32).webp","Fot1 (33).webp","Fot1 (34).webp","Fot1 (35).webp","Fot1 (36).webp",
      "Fot1 (37).webp","Fot1 (38).webp","Fot1 (39).webp","Fot1 (40).webp","Fot1 (41).webp","Fot1 (42).webp","Fot1 (43).webp",
      "Fot1 (44).webp","Fot1 (45).webp","Fot1 (46).webp","Fot1 (47).webp","Fot1 (48).webp","Fot1 (49).webp","Fot1 (50).webp",
      "Fot1 (51).webp","Fot1 (52).webp","Fot1 (53).webp","Fot1 (54).webp","Fot1 (55).webp","Fot1 (56).webp","Fot1 (57).webp",
      "Fot1 (58).webp","Fot1 (59).webp","Fot1 (60).webp","Fot1 (61).webp","Fot1 (62).webp","Fot1 (63).webp","Fot1 (64).webp",
      "Fot1 (65).webp","Fot1 (66).webp","Fot1 (67).webp","Fot1 (68).webp","Fot1 (69).webp","Fot1 (70).webp","Fot1 (71).webp",
      "Fot1 (72).webp","Fot1 (73).webp","Fot1 (74).webp","Fot1 (75).webp","Fot1 (76).webp","Fot1 (77).webp","Fot1 (78).webp",
      "Fot1 (79).webp","Fot1 (80).webp","Fot1 (81).webp","Fot1 (82).webp","Fot1 (83).webp","Fot1 (84).webp","Fot1 (85).webp",
      "Fot1 (86).webp","Fot1 (87).webp","Fot1 (88).webp","Fot1 (89).webp","Fot1 (90).webp","Fot1 (91).webp","Fot1 (92).webp",
      "Fot1 (93).webp"
    ];

    const grid = document.getElementById('photoGrid');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const closeModal = document.getElementById('closeModal');

    photos.forEach(photo => {
      const img = document.createElement('img');
      img.src = `./content/${photo}`;
      img.alt = photo;
      img.addEventListener('click', () => {
        modalImage.src = `./content/${photo}`;
        modal.style.display = 'flex';
      });
      grid.appendChild(img);
    });

    // Cerrar modal
    closeModal.addEventListener('click', () => modal.style.display = 'none');
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && modal.style.display === 'flex') {
        modal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
