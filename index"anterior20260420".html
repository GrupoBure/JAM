<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAM</title>

<style>

html,body{
margin:0;
height:100%;
}

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:center;
}

/* BOTÓN */

.catalogo{
position:fixed;
top:90px;
left:90px;
z-index:10;
}

.catalogo img{
width:220px;
display:block;
}

</style>

</head>

<body>

<img class="bg" src="assets/Fondo de pantalla web.png">

<a href="catalogoTest.html" class="catalogo">
<img 
id="btnCatalogo"
src="assets/BtnCatalogo.png"
onmouseover="this.src='assets/BtnCatalogoSobre.png'"
onmouseout="this.src='assets/BtnCatalogo.png'"
onmousedown="this.src='assets/BtnCatalogoPress.png'"
onmouseup="this.src='assets/BtnCatalogoSobre.png'"
>
</a>

</body>
</html>
