<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAM</title>
  <style>

html,body{
margin:0;
height:100%;
}

.bg{
position:fixed;
top:50%;
left:50%;

height:100vh;
width:auto;

transform:translate(-50%,-50%);
}

    .catalogo-link {
      position: fixed;
      left: 72px;
      top: 86px;
      z-index: 10;
      display: block;
      line-height: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .catalogo-img {
      display: block;
      width: 220px;
      height: auto;
      background: transparent;
      border: 0;
      outline: none;
      box-shadow: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
    }

    @media (max-width: 900px) {
      .catalogo-link {
        left: 40px;
        top: 58px;
      }

      .catalogo-img {
        width: 190px;
      }
    }

      .catalogo-img {
        width: 190px;
      }
    }

    @media (max-width: 640px) {
      .catalogo-link {
        left: 22px;
        top: 38px;
      }

      .catalogo-img {
        width: 165px;
      }
    }

      .catalogo-img {
        width: 170px;
      }
    }
  </style>
</head>
<body>
  <img class="bg" src="assets/Fondo de pantalla web.png" alt="Fondo de pantalla web">

  <a class="catalogo-link" href="catalogoTest.html" aria-label="Ir al catálogo">
    <img
      id="catalogoBtn"
      class="catalogo-img"
      src="assets/BtnCatalogo.png"
      alt="Catálogo"
    >
  </a>

  <script>
    (function () {
      const btn = document.getElementById('catalogoBtn');
      const normal = 'assets/BtnCatalogo.png';
      const hover = 'assets/BtnCatalogoSobre.png';
      const press = 'assets/BtnCatalogoPress.png';

      btn.addEventListener('mouseenter', function () {
        btn.src = hover;
      });

      btn.addEventListener('mouseleave', function () {
        btn.src = normal;
      });

      btn.addEventListener('mousedown', function () {
        btn.src = press;
      });

      btn.addEventListener('mouseup', function () {
        btn.src = hover;
      });

      btn.addEventListener('touchstart', function () {
        btn.src = press;
      }, { passive: true });

      btn.addEventListener('touchend', function () {
        btn.src = normal;
      }, { passive: true });

      btn.addEventListener('touchcancel', function () {
        btn.src = normal;
      }, { passive: true });
    })();
  </script>
</body>
</html>
