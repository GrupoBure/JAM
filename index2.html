<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAM</title>

<style>

html,body{
margin:0;
height:100%;
background:black;
}

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

object-fit:contain;
object-position:center;

}

.overlay{
position:relative;
height:100%;
display:flex;
justify-content:center;
align-items:flex-end;
padding-bottom:120px;
}

.catalogo{
width:300px;
height:140px;
background-image:url("assets/BtnCatalogo.png");
background-size:contain;
background-repeat:no-repeat;
background-position:center;
border:none;
cursor:pointer;
}

.catalogo:hover{
background-image:url("assets/BtnCatalogoSobre.png");
}

.catalogo:active{
background-image:url("assets/BtnCatalogoPress.png");
}

</style>

</head>

<body>

<img class="bg" src="assets/Fondo de pantalla web.png">

<div class="overlay">
<a href="catalogoTest.html">
<button class="catalogo"></button>
</a>
</div>

</body>
</html>
